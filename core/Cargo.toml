[package]
name = "routines-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The rules of Routines, with no I/O"
publish = false

[dependencies]
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
