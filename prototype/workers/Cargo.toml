[package]
name = "routines-workers-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }
argon2 = "0.6.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
url = "2"
uuid = { version = "1", features = ["v4", "js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

# See patch-webauthn.sh: run it before building.
[patch.crates-io]
webauthn-rs-core = { path = "vendor/webauthn-rs-core" }
