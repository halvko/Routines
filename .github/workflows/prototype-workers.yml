# Builds the Rust Workers prototype and runs its checks on the real Workers
# runtime (workerd, via wrangler dev). Only when the prototype changes.
name: Workers prototype

on:
  pull_request:
    paths: ['prototype/workers/**', '.github/workflows/prototype-workers.yml']
  workflow_dispatch:

jobs:
  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/workers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: npm ci
      - run: worker-build --release
      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8787/ && exit 0; sleep 2; done
          cat wrangler.log; exit 1
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        run: cat wrangler.log
